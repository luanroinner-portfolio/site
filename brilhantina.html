<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(26px, 8.3vw, 120px); line-height: 0.9; letter-spacing: -0.03em">BRILHANTINA</h1>
<div style="margin-top: 48px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: space-between; align-items: flex-end">
<p style="margin: 0; flex: 1 1 420px; max-width: 620px; font-size: clamp(20px, 2vw, 26px); line-height: 1.4; font-weight: 300; color: #3A3A5C"><span class="pt">Um app que recomenda lazer, organiza a rotina e lembra eventos e medicamentos para o público 60+. <em style="font-style: italic; color: #3F4FC7">“Seja bem-vindo aos seus anos brilhantes.”</em></span><span class="en">An app that recommends leisure activities, organizes daily routines and sends event and medication reminders for people aged 60+. <em style="font-style: italic; color: #3F4FC7">“Welcome to your brilliant years.”</em></span></p>
<dl style="flex: 1 1 360px; max-width: 520px; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px 32px; border-top: 1px solid rgba(22,22,58,0.2); padding-top: 20px">

<div><dt style="font-size: 13px; letter-spacing: 0.2em; color: #5E5E7A"><span class="pt">ESCOPO</span><span class="en">SCOPE</span></dt><dd style="margin: 6px 0 0"><span class="pt">Pesquisa, fluxos, UI e protótipo</span><span class="en">Research, flows, UI and prototype</span></dd></div>
<div><dt style="font-size: 13px; letter-spacing: 0.2em; color: #5E5E7A"><span class="pt">PÚBLICO</span><span class="en">AUDIENCE</span></dt><dd style="margin: 6px 0 0"><span class="pt">Pessoas com 60 anos ou mais</span><span class="en">People aged 60 and over</span></dd></div>
<div><dt style="font-size: 13px; letter-spacing: 0.2em; color: #5E5E7A"><span class="pt">EQUIPE</span><span class="en">TEAM</span></dt><dd style="margin: 6px 0 0">Iasmin Guimarães, Kamila Simões, Luan Henrique, Mayara Farche e Mônicka Tonini</dd></div>
</dl>

<section style="max-width: 1360px; margin: 0 auto; padding: 120px 24px 40px">
<div style="display: flex; flex-wrap: wrap; gap: 32px 64px">
<p style="margin: 0; flex: 0 0 220px; font-size: 13px; letter-spacing: 0.3em; color: #5E5E7A"><span class="pt">O PROBLEMA</span><span class="en">THE PROBLEM</span></p>
<div style="flex: 1 1 520px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; margin-bottom: 28px">
<span style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(80px, 11vw, 150px); line-height: 0.85; color: #F2BE5C">33</span>
<span style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(24px, 3vw, 40px); line-height: 1.05; letter-spacing: -0.02em"><span class="pt">milhões de idosos<br>no Brasil</span><span class="en">million older adults<br>in Brazil</span></span>
</div>
<ul style="margin: 0 0 24px; padding: 0 0 0 20px; display: flex; flex-direction: column; gap: 10px; font-size: 19px; max-width: 640px">
<li><span class="pt">Até 2030, o Brasil terá a <strong>5ª população mais idosa do mundo</strong>.</span><span class="en">By 2030, Brazil will have the <strong>5th oldest population in the world</strong>.</span></li>
<li><span class="pt">A população 60+ é a mais <strong>afetada pela depressão</strong>, cerca de <strong>13%</strong>.</span><span class="en">People aged 60+ are the group most <strong>affected by depression</strong>, around <strong>13%</strong>.</span></li>
</ul>
<p style="margin: 0; font-size: clamp(22px, 2.2vw, 30px); font-weight: 600; letter-spacing: -0.01em"><span class="pt">Precisamos de inovação.</span><span class="en">We need innovation.</span></p>
</div>
</div>
</section>

<!-- PESQUISA -->

<div style="background: #3F4FC7; color: #FFFFFF">
<div style="max-width: 1360px; margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px">
<div style="display: flex; flex-wrap: wrap; gap: 32px 64px; margin-bottom: 56px">
<p style="margin: 0; flex: 0 0 220px; font-size: 13px; letter-spacing: 0.3em; color: #F2BE5C"><span class="pt">A PESQUISA</span><span class="en">THE RESEARCH</span></p>
<div style="flex: 1 1 520px; min-width: 0; max-width: 760px">
<h2 style="margin: 0 0 16px; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(28px, 3.4vw, 48px); line-height: 1.1; letter-spacing: -0.02em; color: #F2BE5C"><span class="pt">Entendendo melhor o público 60+</span><span class="en">Getting to know the 60+ audience</span></h2>
<p style="margin: 0; font-weight: 300; font-size: 19px; color: #E4E6FA"><span class="pt">Com uma pesquisa quantitativa e qualitativa, investigamos se idosos que já tinham algum acesso à tecnologia gostariam de ter mais ajuda dela no dia a dia.</span><span class="en">Through quantitative and qualitative research, we explored whether older adults who already had some access to technology would like more help from it in their daily lives.</span></p>
</div>

<div style="padding: 28px; border-radius: 16px; background: rgba(255,255,255,0.1)"><div style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 48px; line-height: 1">80%</div><p style="margin: 10px 0 0; color: #E4E6FA"><span class="pt">têm entre 60 e 70 anos</span><span class="en">are between 60 and 70 years old</span></p></div>
<div style="padding: 28px; border-radius: 16px; background: rgba(255,255,255,0.1)"><div style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 48px; line-height: 1">100%</div><p style="margin: 10px 0 0; color: #E4E6FA"><span class="pt">têm e usam muito o smartphone</span><span class="en">own a smartphone and use it a lot</span></p></div>
<div style="padding: 28px; border-radius: 16px; background: rgba(255,255,255,0.1)"><div style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 48px; line-height: 1">60%</div><p style="margin: 10px 0 0; color: #E4E6FA"><span class="pt">têm e usam muito Smart TV e computador</span><span class="en">own a smart TV and computer and use them a lot</span></p></div>
<div style="padding: 28px; border-radius: 16px; background: rgba(255,255,255,0.1)"><div style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 48px; line-height: 1">70%</div><p style="margin: 10px 0 0; color: #E4E6FA"><span class="pt">têm ensino fundamental; 30% têm ensino médio ou superior</span><span class="en">have primary education; 30% have secondary or higher education</span></p></div>
</div>
<div style="margin-top: 16px; padding: clamp(28px, 4vw, 48px); border-radius: 16px; background: #FFFFFF; color: #16163A; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 48px">
<span style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(64px, 8vw, 112px); line-height: 0.9; color: #3F4FC7">80%</span>
<p style="margin: 0; flex: 1 1 380px; font-size: clamp(19px, 1.8vw, 24px); line-height: 1.4"><span class="pt">consideram que os apps que usam hoje não são fáceis, têm receio de experimentar um app novo e <strong>gostariam de receber dicas de novas atividades</strong>.</span><span class="en">find the apps they use today hard to use, are wary of trying a new app and <strong>would like tips on new activities</strong>.</span></p>
</div>
</div>
</div>

<!-- SOLUÇÃO -->
<section style="max-width: 1360px; margin: 0 auto; padding: 40px 24px 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 32px; border-bottom: 1px solid rgba(22,22,58,0.2); padding-bottom: 20px">
<h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(28px, 3.4vw, 48px); letter-spacing: -0.02em"><span class="pt">A solução</span><span class="en">The solution</span></h2>
<p style="margin: 0; max-width: 520px; font-weight: 300; color: #3A3A5C"><span class="pt">A partir de perguntas sobre rotina, objetivos, desejos e preferências, o Brilhantina traz opções personalizadas e ajuda inclusive quem tem dificuldade para organizar o dia.</span><span class="en">Based on questions about routine, goals, wishes and preferences, Brilhantina offers personalized options and helps even those who struggle to organize their day.</span></p>
</div>

</section>

<h2 style="margin: 0 0 28px; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(28px, 3.4vw, 48px); line-height: 1.1; letter-spacing: -0.02em"><span class="pt">Tudo o que importa, num lugar só</span><span class="en">Everything that matters, in one place</span></h2>

<li style="padding: 16px 0; border-bottom: 1px solid rgba(22,22,58,0.2); font-size: 19px"><span class="pt">Rotina e preferências organizadas</span><span class="en">An organized routine and preferences</span></li>
<li style="padding: 16px 0; border-bottom: 1px solid rgba(22,22,58,0.2); font-size: 19px"><span class="pt">Lembretes de eventos e medicamentos</span><span class="en">Event and medication reminders</span></li>
</ul>
