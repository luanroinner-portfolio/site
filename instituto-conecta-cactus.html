<div style="margin-top: 48px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: space-between; align-items: flex-end">
<p style="margin: 0; flex: 1 1 420px; max-width: 620px; font-size: clamp(20px, 2vw, 26px); line-height: 1.4; font-weight: 300; color: #3A3A3A"><span class="pt">Identidade visual para uma iniciativa social que transforma realidades por meio de educação, esporte, inclusão, empreendedorismo feminino e tecnologia. <em style="font-style: italic; color: #1E8FD6">Diferenças que viram unidade.</em></span><span class="en">Visual identity for a social initiative that changes lives through education, sports, inclusion, female entrepreneurship and technology. <em style="font-style: italic; color: #1E8FD6">Differences that become unity.</em></span></p>
<dl style="flex: 1 1 360px; max-width: 520px; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px 32px; border-top: 1px solid rgba(21,21,21,0.2); padding-top: 20px">
<div><dt style="font-size: 13px; letter-spacing: 0.2em; color: #6A6A6A"><span class="pt">CLIENTE</span><span class="en">CLIENT</span></dt><dd style="margin: 6px 0 0">Instituto Conecta Cactus</dd></div>
<div><dt style="font-size: 13px; letter-spacing: 0.2em; color: #6A6A6A"><span class="pt">ESCOPO</span><span class="en">SCOPE</span></dt><dd style="margin: 6px 0 0"><span class="pt">Conceito, símbolo, tipografia, cores, ilustração e aplicações</span><span class="en">Concept, symbol, typography, color, illustration and applications</span></dd></div>

<div><dt style="font-size: 13px; letter-spacing: 0.2em; color: #6A6A6A"><span class="pt">ORIGEM</span><span class="en">ORIGIN</span></dt><dd style="margin: 6px 0 0"><span class="pt">Minas Gerais + artesanato nordestino</span><span class="en">Minas Gerais + Northeastern Brazilian craft</span></dd></div>
</dl>

<!-- IMAGEM PRINCIPAL -->
<section aria-label="Marca do Instituto Conecta Cactus" style="max-width: 1360px; margin: 0 auto; padding: 0 24px">

<!-- CONCEITO -->
<section style="max-width: 1360px; margin: 0 auto; padding: 120px 24px 40px">
<div style="display: flex; flex-wrap: wrap; gap: 32px 64px">
<p style="margin: 0; flex: 0 0 220px; font-size: 13px; letter-spacing: 0.3em; color: #6A6A6A"><span class="pt">CONCEITO &amp; ORIGENS</span><span class="en">CONCEPT &amp; ORIGINS</span></p>
<div style="flex: 1 1 520px; min-width: 0; max-width: 820px">
<h2 style="margin: 0 0 24px; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(28px, 3.4vw, 48px); line-height: 1.1; letter-spacing: -0.02em"><span class="pt">Uma linguagem capaz de acolher histórias, territórios e públicos diferentes</span><span class="en">A language able to embrace different stories, territories and audiences</span></h2>
<p style="margin: 0 0 18px; font-size: 19px; color: #3A3A3A"><span class="pt">O projeto nasceu da necessidade de traduzir visualmente a essência do instituto: <strong>resiliência, pluralidade e impacto social</strong>. Mais do que uma identidade funcional, o objetivo era construir uma linguagem visual para muitas vozes.</span><span class="en">The project came from the need to visually translate the institute's essence: <strong>resilience, plurality and social impact</strong>. More than a functional identity, the goal was to build a visual language for many voices.</span></p>
<p style="margin: 0; font-size: 19px; color: #3A3A3A"><span class="pt">Concebido em Minas Gerais e por mineiros, o projeto carrega referências da cultura local — fachadas, janelas e uma sensação de calor e pertencimento. Em diálogo com essa base, incorporei elementos do <strong>artesanato nordestino</strong>, região onde nasci e cresci. Vitrais, cores, formas e texturas artesanais se juntam numa identidade que reflete a diversidade cultural do Brasil.</span><span class="en">Conceived in Minas Gerais, by people from Minas Gerais, the project carries references to local culture — façades, windows and a sense of warmth and belonging. In dialogue with that foundation, I brought in elements of <strong>Northeastern Brazilian craftsmanship</strong>, the region where I was born and raised. Stained glass, colors, shapes and handmade textures come together in an identity that reflects Brazil's cultural diversity.</span></p>
</div>
</div>
</section>

<!-- MOODBOARD -->
<section style="max-width: 1360px; margin: 0 auto; padding: 80px 24px 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 32px; border-bottom: 1px solid rgba(21,21,21,0.2); padding-bottom: 20px">
<h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(28px, 3.4vw, 48px); letter-spacing: -0.02em"><span class="pt">Pluralidade brasileira</span><span class="en">Brazilian plurality</span></h2>
<p style="margin: 0; max-width: 520px; font-weight: 300; color: #3A3A3A"><span class="pt">Vitrais, janelas coloniais, cerâmica e a arte modernista brasileira formaram o repertório visual da marca.</span><span class="en">Stained glass, colonial windows, ceramics and Brazilian modernist art shaped the brand's visual repertoire.</span></p>
</div>
<img src="assets/583f04ca520191faf1501772f0bfd906.jpg" alt="Moodboard com vitrais, janelas coloniais mineiras, cerâmicas artesanais e pintura modernista com cacto" style="display: block; width: 100%; height: auto; border-radius: 16px">
</section>

<!-- SÍMBOLO, TIPO, COR -->
<section style="padding: 80px 0">
<div style="background: #9BD3DE">
<div style="max-width: 1360px; margin: 0 auto; padding: clamp(56px, 7vw, 96px) 24px">
<div style="display: flex; flex-wrap: wrap; gap: 32px 64px; margin-bottom: 48px">
<p style="margin: 0; flex: 0 0 220px; font-size: 13px; letter-spacing: 0.3em; color: #1F4A55"><span class="pt">O SISTEMA</span><span class="en">THE SYSTEM</span></p>
<div style="flex: 1 1 520px; min-width: 0; max-width: 760px">
<h2 style="margin: 0 0 16px; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(28px, 3.4vw, 48px); line-height: 1.1; letter-spacing: -0.02em"><span class="pt">Janela, elementos e cores</span><span class="en">Window, elements and colors</span></h2>
<p style="margin: 0; font-size: 19px; color: #1F3A40"><span class="pt">O símbolo parte do arco de uma <strong>janela</strong> — abertura e perspectiva. Dentro dele, o cacto e o sol falam de <strong>resiliência e esperança</strong>. As divisões coloridas, inspiradas no vitral, mostram como partes diferentes formam um todo harmônico.</span><span class="en">The symbol starts from the arch of a <strong>window</strong> — openness and perspective. Inside it, the cactus and the sun speak of <strong>resilience and hope</strong>. The colored divisions, inspired by stained glass, show how different parts form a harmonious whole.</span></p>
</div>
</div>
<img src="assets/3d432c94d064cfb21307998c14695e36.jpg" alt="Construção do símbolo em três etapas: janela, elementos e cores" style="display: block; width: 100%; height: auto; border-radius: 16px; margin-bottom: 16px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px">
<figure style="margin: 0">
<img src="assets/08b1df7f57f31a277eaeea28d0da2198.jpg" alt="Tipografia da marca: Instituto Conecta leve e espaçado, Cactus em negrito" style="display: block; width: 100%; height: auto; border-radius: 16px">
<figcaption style="margin-top: 12px; font-size: 15px; color: #1F3A40"><span class="pt">Tipografia — “Instituto Conecta” leve e institucional; “Cactus” forte e expressivo.</span><span class="en">Typography — “Instituto Conecta” light and institutional; “Cactus” bold and expressive.</span></figcaption>
</figure>
<figure style="margin: 0">
<img src="assets/e0a77d1ef4075165d7eddd0579568a27.jpg" alt="Paleta em arcos: azul, amarelo, verde e rosa, com tons de apoio" style="display: block; width: 100%; height: auto; border-radius: 16px">
<figcaption style="margin-top: 12px; font-size: 15px; color: #1F3A40"><span class="pt">Cor como unidade — cada tom representa um pilar do instituto.</span><span class="en">Color as unity — each tone stands for one of the institute's pillars.</span></figcaption>
</figure>
</div>
</div>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 32px; border-bottom: 1px solid rgba(21,21,21,0.2); padding-bottom: 20px">

<p style="margin: 0; max-width: 520px; font-weight: 300; color: #3A3A3A"><span class="pt">Fachada, sinalização, campanhas e materiais. Os personagens ilustrados dão rosto às pessoas que o instituto acolhe.</span><span class="en">Façade, signage, campaigns and materials. The illustrated characters give a face to the people the institute supports.</span></p>
</div>
<img src="assets/2b1fbf5993dd2a5bd588bc4b2a687932.jpg" alt="Fachada de concreto com o símbolo e o nome Instituto Conecta Cactus em letras caixa" style="display: block; width: 100%; height: auto; border-radius: 16px; margin-bottom: 16px">

<img src="assets/2ed32583e7ca02ae5e301118c366f889.jpg" alt="Placas de sinalização com o símbolo colorido e em traço" style="display: block; width: 100%; height: auto; border-radius: 16px">
<img src="assets/772006173bf5b69aad00b844286833a1.jpg" alt="Canecas amarela e azul com personagens ilustrados" style="display: block; width: 100%; height: auto; border-radius: 16px">
<img src="assets/1f76522749ed1da1e42f9464e8077ef6.jpg" alt="Envelope kraft e cartão com a campanha Seja um aliado nessa causa" style="display: block; width: 100%; height: auto; border-radius: 16px">
</div>
<img src="assets/64cbe538a126ac88bff6fd451bef900a.jpg" alt="Ecobag com personagem ilustrada e a marca" style="display: block; width: 100%; height: auto; border-radius: 16px; margin-bottom: 16px">
<img src="assets/57a41ab2c3c83981a65d53b401eba78d.jpg" alt="Outdoor amarelo na rua: Seja você também um aliado nessa causa" style="display: block; width: 100%; height: auto; border-radius: 16px">
</section>
