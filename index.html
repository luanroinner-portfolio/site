<div style="display: flex; flex-wrap: wrap; border: 1px solid rgba(237,237,242,0.2); border-radius: 16px; overflow: hidden">

<img src="assets/059354874c46580ce8d8ffc154cd8cfe.jpg" alt="Luan Roinner sorrindo de capacete e óculos escuros num teleférico de esqui, com montanhas nevadas ao fundo" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 42% 42%; filter: grayscale(1) contrast(1.05); transform: scaleX(-1)">
</div>
<div style="flex: 3 1 520px; min-width: 0; padding: clamp(28px, 4vw, 56px); width: 762px">
<p style="margin: 0 0 24px; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.25; letter-spacing: -0.02em; font-weight: 400"><span class="pt">Penso em narrativa visual e persuasão com a mesma naturalidade com que desenho jornadas, testo hipóteses e <em style="font-weight: 300; color: rgb(201, 190, 255)">leio dados.</em></span><span class="en">I think about visual storytelling and persuasion as naturally as I map journeys, test hypotheses and <em style="font-weight: 300; color: rgb(201, 190, 255)">read data.</em></span></p>
<div style="margin: 0 0 16px; font-weight: 300; color: #C4C4CF"><p class="pt" style="margin: 0 0 16px">Nasci em Caicó, no interior do Rio Grande do Norte, e me mudei para São Paulo em 2021. Minha mãe trabalhou com moda a vida inteira, e eu cresci no meio disso, folheando revistas e ficando fascinado pelos editoriais. Foi ali que o design me pegou, antes mesmo de eu saber que aquilo tinha nome. Os games vieram junto desde pequeno e, anos depois, virou parte do meu trabalho e até hoje é uma das minhas grandes paixões.</p><p class="en" style="margin: 0 0 16px">I was born in Caicó, in the countryside of Rio Grande do Norte, Brazil, and moved to São Paulo in 2021. My mother worked in fashion her whole life, and I grew up surrounded by it, flipping through magazines and fascinated by the editorials. That's where design got me, before I even knew it had a name. Games came along when I was a kid too and, years later, became part of my work — they're still one of my great passions.</p>
</div>
<div style="margin: 0 0 16px; font-weight: 300; color: #C4C4CF"><p class="pt" style="margin: 0 0 16px">Comecei na direção de arte e na criação publicitária, em agências e times de marca, e depois migrei para UX/UI e Product Design. São mais de 8 anos conectando as duas pontas: conceito e identidade visual de um lado, e pesquisa, dados e produto do outro. Passei por games, finanças, varejo e setor automotivo, criando de identidades visuais e campanhas a produtos digitais completos, com pesquisa com usuários, personas, testes de usabilidade e testes A/B.</p><p class="en" style="margin: 0 0 16px">I started in art direction and advertising, at agencies and brand teams, and then moved into UX/UI and Product Design. That's more than 8 years connecting both ends: concept and visual identity on one side, research, data and product on the other. I've worked in games, finance, retail and automotive, creating everything from visual identities and campaigns to complete digital products, with user research, personas, usability testing and A/B testing.</p>
<p class="pt" style="margin: 0 0 16px">Hoje atuo do discovery ao delivery em times ágeis, transformando objetivos de negócio em interfaces simples e consistentes com o Design System. Uso GenAI no dia a dia para acelerar pesquisa e prototipação, e levo comigo repertório de motion, Adobe e Figma.</p><p class="en" style="margin: 0 0 16px">Today I work from discovery to delivery in agile teams, turning business goals into simple interfaces consistent with the Design System. I use GenAI every day to speed up research and prototyping, and I bring a background in motion, Adobe and Figma.</p></div>
<div style="margin: 0 0 40px; font-weight: 300; color: #C4C4CF"><p class="pt" style="margin: 0 0 16px">Fora do design, sou apaixonado por esqui, viagem, gastronomia e música eletrônica, e vivo tentando juntar essas quatro paixões. Adoro trabalhar junto, trocar ideias e conhecer gente nova. Se quiser bater um papo, é só chamar.</p><p class="en" style="margin: 0 0 16px">Outside design, I'm passionate about skiing, travel, food and electronic music, and I'm always trying to bring those four passions together. I love working with others, trading ideas and meeting new people. If you'd like to chat, just reach out.</p>
</div>
<p style="margin: 0 0 14px; font-size: 14px; color: #B5B5C2"><span class="pt">Competências</span><span class="en">Skills</span></p>
