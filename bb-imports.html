<p style="margin: 0 0 20px; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.25; letter-spacing: -0.02em"><span class="pt">Duas iniciais unidas pelo “&amp;”: a parceria que deu origem à marca virou a <em style="font-style: italic; font-weight: 300; color: #5B1A2B">própria assinatura.</em></span><span class="en">Two initials joined by the “&amp;”: the partnership behind the brand became <em style="font-style: italic; font-weight: 300; color: #5B1A2B">its very signature.</em></span></p>
<p style="margin: 0; font-weight: 300; color: #3A3034"><span class="pt">A B&amp;B se apresenta como a ponte para moda e acessórios de luxo, com curadoria feita com critério, cuidado e bom gosto. A identidade traduz isso em uma serifa clássica, um monograma compacto e uma paleta de tons de vinho, tinta e papel.</span><span class="en">B&amp;B presents itself as a bridge to luxury fashion and accessories, curated with discernment, care and good taste. The identity translates this into a classic serif, a compact monogram and a palette of wine, ink and paper tones.</span></p>
</div>
</div>

</div>
<div style="display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: center">
<img src="assets/7fd481f704e736efa571bdbcb93ccfc1.jpg" alt="Anatomia do logotipo: monograma B&amp;B, texto imports e logo completo" style="flex: 1 1 420px; min-width: 0; max-width: 620px; height: auto; border-radius: 16px; background: #EFE9E2">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div><h3 style="margin: 0 0 6px; font-size: 20px; font-weight: 600; color: #5B1A2B"><span class="pt">Ícone e monograma</span><span class="en">Icon and monogram</span></h3><p style="margin: 0; font-weight: 300; color: #3A3034"><span class="pt">A assinatura da marca, formada pelas iniciais unidas pelo “&amp;”. Compacto e reconhecível, vai em papelaria, perfis, selos, lacres e etiquetas.</span><span class="en">The brand's signature, formed by the initials joined by the “&amp;”. Compact and recognizable, it goes on stationery, profiles, stamps, seals and tags.</span></p></div>
<div><h3 style="margin: 0 0 6px; font-size: 20px; font-weight: 600; color: #5B1A2B"><span class="pt">Logo completo</span><span class="en">Full logo</span></h3><p style="margin: 0; font-weight: 300; color: #3A3034"><span class="pt">Monograma e “imports” juntos: a versão institucional para site, embalagens, documentos e apresentações.</span><span class="en">Monogram and “imports” together: the institutional version for the website, packaging, documents and presentations.</span></p></div>
<div><h3 style="margin: 0 0 6px; font-size: 20px; font-weight: 600; color: #5B1A2B"><span class="pt">Texto</span><span class="en">Wordmark</span></h3><p style="margin: 0; font-weight: 300; color: #3A3034"><span class="pt">“imports” indica a atividade da marca e nunca aparece sozinho, sempre ao lado do monograma.</span><span class="en">“imports” describes what the brand does and never appears on its own, always next to the monogram.</span></p></div>
</div>
